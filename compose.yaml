# The Naughty List on a UGREEN NAS.
# Docker app > Project > Create, give it a name, and paste this file. See docs/DEVELOPER_NOTES.md (Deployment guide).
services:
  naughty-list:
    image: ghcr.io/cheesezilla/naughty-list:latest
    container_name: naughty-list
    ports:
      - "8081:8080"   # NAS port 8081; change the left number if it is taken
    volumes:
      # Save data. Create the shared folder "docker" first; the naughty-list folder is made for you.
      - /volume1/docker/naughty-list:/data
    environment:
      - TZ=Asia/Singapore   # time zone for the server's log; change to yours, for example America/New_York
    restart: unless-stopped

  # Optional: let friends play from anywhere through a Cloudflare Tunnel.
  # Remove the # from the lines below and paste your tunnel token (docs/DEVELOPER_NOTES.md (Deployment guide), part 3).
