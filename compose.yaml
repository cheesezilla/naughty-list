# Compose project for the UGREEN NAS (Docker app > Project > Create, paste this file).
services:
  naughty-list:
    image: ghcr.io/cheesezilla/naughty-list:latest
    container_name: naughty-list
    ports:
      - "8080:8080"
    volumes:
      # Save data. Create this shared folder on the NAS first.
      # If the log says it can't write to /data, add  user: "0:0"  under the service.
      - /volume1/docker/naughty-list:/data
    restart: unless-stopped
