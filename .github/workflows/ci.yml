name: CI
on:
  pull_request:
  push:
    branches: [main, integration]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-content
      - run: npm run typecheck
      - run: npm test
      - run: npm run simulate -- --players 200
      # Advisory: warns about balance issues and a stale docs/BALANCE.md, never fails the build.
      - run: npm run balance -- --ci
        continue-on-error: true
      - run: npm run build
