name: Docker image
on:
  pull_request:
  push:
    branches: [main, integration]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tags.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Merging integration into main publishes :latest. If package.json holds a version that has no git tag yet,
      # this push is that release: it also publishes :X.Y.Z and :X.Y, and the release job below tags it.
      - name: Work out image tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=ghcr.io/${{ github.repository }}
          version=${{ github.sha }}
          list="$repo:${{ github.sha }}"
          if [ "${{ github.ref_name }}" = integration ]; then
            list="$list,$repo:integration"
          else
            list="$list,$repo:latest"
            if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_name }}" = main ]; then
              v=$(node -p "require('./package.json').version")
              if ! gh api "repos/${{ github.repository }}/git/ref/tags/v$v" >/dev/null 2>&1; then
                list="$list,$repo:$v,$repo:${v%.*}"
                version=$v
                echo "release=$v" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Pull requests build and smoke-test the image; pushes to main publish :latest, pushes to integration publish :integration.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (root-owned save folder, like a fresh NAS share)
        if: github.event_name == 'pull_request'
        run: |
          sudo mkdir -p /tmp/nl-data && sudo chown root:root /tmp/nl-data && sudo chmod 755 /tmp/nl-data
          docker run -d --name nl -p 8080:8080 -v /tmp/nl-data:/data ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/setup-status | grep '"needsAdmin":true'
          curl -fs -c jar -H 'content-type: application/json' -d '{"username":"smoke","password":"smoketest123"}' localhost:8080/api/auth/signup
          curl -fs -b jar -X POST -H 'content-type: application/json' -d '{}' localhost:8080/api/hunt
          docker restart nl
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs -b jar localhost:8080/api/me | grep '"hunts":1'
          # Save files left owned by root with no access for others must be repaired on start.
          docker stop nl
          sudo chown root:root /tmp/nl-data /tmp/nl-data/* && sudo chmod 600 /tmp/nl-data/* && sudo chmod 700 /tmp/nl-data
          docker start nl
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs -b jar localhost:8080/api/me | grep '"hunts":1'
          sudo ls -la /tmp/nl-data
          docker logs nl
      # Lets eddy try a pull request on the NAS before merging: image tag pr-<number>.
      - name: Publish a test image for this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          docker push ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
      - name: Container log
        if: failure() && github.event_name == 'pull_request'
        run: docker logs nl || true
  # A new version on main gets its git tag and GitHub Release, with that version's CHANGELOG.md section as the notes.
  release:
    if: needs.image.outputs.release != ''
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.image.outputs.release }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[|^\[[^]]*\]: / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for $VERSION"; exit 1; }
          gh release create "v$VERSION" --target "${{ github.sha }}" --title "The Naughty List $VERSION" --notes-file notes.md
