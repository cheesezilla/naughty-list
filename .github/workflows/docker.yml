name: Docker image
on:
  pull_request:
  push:
    branches: [main, integration]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version tag (v1.2.3) must match package.json, then publishes :1.2.3 and :1.2 instead of :latest.
      - name: Work out image tags
        id: tags
        run: |
          repo=ghcr.io/${{ github.repository }}
          if [ "${{ github.ref_type }}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            [ "$v" = "$(node -p "require('./package.json').version")" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
            echo "list=$repo:$v,$repo:${v%.*},$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = integration ]; then
            echo "list=$repo:integration,$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "list=$repo:latest,$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      # Pull requests build and smoke-test the image; pushes to main publish :latest, pushes to integration publish :integration.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (root-owned save folder, like a fresh NAS share)
        if: github.event_name == 'pull_request'
        run: |
          sudo mkdir -p /tmp/nl-data && sudo chown root:root /tmp/nl-data && sudo chmod 755 /tmp/nl-data
          docker run -d --name nl -p 8080:8080 -v /tmp/nl-data:/data ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/setup-status | grep '"needsAdmin":true'
          curl -fs -c jar -H 'content-type: application/json' -d '{"username":"smoke","password":"smoketest123"}' localhost:8080/api/auth/signup
          curl -fs -b jar -X POST -H 'content-type: application/json' -d '{}' localhost:8080/api/hunt
          docker restart nl
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs -b jar localhost:8080/api/me | grep '"hunts":1'
          # Save files left owned by root with no access for others must be repaired on start.
          docker stop nl
          sudo chown root:root /tmp/nl-data /tmp/nl-data/* && sudo chmod 600 /tmp/nl-data/* && sudo chmod 700 /tmp/nl-data
          docker start nl
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs -b jar localhost:8080/api/me | grep '"hunts":1'
          sudo ls -la /tmp/nl-data
          docker logs nl
      # Lets eddy try a pull request on the NAS before merging: image tag pr-<number>.
      - name: Publish a test image for this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          docker push ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
      - name: Container log
        if: failure() && github.event_name == 'pull_request'
        run: docker logs nl || true
  # A version tag also publishes a GitHub Release, using that version's section of CHANGELOG.md as the notes.
  release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[|^\[[^]]*\]: / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for $v"; exit 1; }
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --title "The Naughty List $v" --notes-file notes.md --verify-tag
