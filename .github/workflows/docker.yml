name: Docker image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write   # to attach the downloadable image file to the "image-latest" release
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests build and smoke-test the image; pushes to main publish it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (root-owned save folder, like a fresh NAS share)
        if: github.event_name == 'pull_request'
        run: |
          sudo mkdir -p /tmp/nl-data && sudo chown root:root /tmp/nl-data && sudo chmod 755 /tmp/nl-data
          docker run -d --name nl -p 8080:8080 -v /tmp/nl-data:/data ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/setup-status | grep '"needsAdmin":true'
          curl -fs -c jar -H 'content-type: application/json' -d '{"username":"smoke","password":"smoketest123"}' localhost:8080/api/auth/signup
          curl -fs -b jar -X POST -H 'content-type: application/json' -d '{}' localhost:8080/api/hunt
          docker restart nl
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs -b jar localhost:8080/api/me | grep '"hunts":1'
          sudo ls -la /tmp/nl-data
          docker logs nl
      # Fallback for NASes that can't reach ghcr.io: the same image as a file that can be imported by hand.
      - name: Export image file
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:latest
          outputs: type=docker,dest=/tmp/naughty-list-image.tar
          cache-from: type=gha
      - name: Publish image file to the image-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gzip -9 /tmp/naughty-list-image.tar
          gh release view image-latest >/dev/null 2>&1 || gh release create image-latest --title "Latest Docker image (file)" --notes "The newest build of main as a Docker image file, for importing on a NAS that can't download from ghcr.io. See docs/DEPLOY.md." --latest=false
          gh release upload image-latest /tmp/naughty-list-image.tar.gz --clobber
          gh release edit image-latest --notes "The newest build of main ($GITHUB_SHA) as a Docker image file, for importing on a NAS that can't download from ghcr.io. See docs/DEPLOY.md."
