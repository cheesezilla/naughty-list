name: Clean up merged branches

# Keeps the 10 most recently merged pull request branches and deletes older
# merged ones. Never touches main, integration, branches with an open PR, or
# branches that were never merged. Scheduled workflows only run from the
# default branch (main).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          KEEP: "10"
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = Number(process.env.KEEP);
            const dry = process.env.DRY_RUN === 'true';
            const protectedNames = new Set(['main', 'integration', context.payload.repository?.default_branch].filter(Boolean));

            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const openHeads = new Set(open.map(p => p.head.ref));

            const closed = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100,
            });
            const merged = closed
              .filter(p => p.merged_at && p.head.repo && p.head.repo.full_name === `${owner}/${repo}`)
              .sort((a, b) => new Date(b.merged_at) - new Date(a.merged_at));

            // Most recently merged first; the first `keep` distinct branches are retained.
            const seen = [];
            for (const p of merged) if (!seen.includes(p.head.ref)) seen.push(p.head.ref);
            const retained = new Set(seen.slice(0, keep));

            for (const ref of seen.slice(keep)) {
              if (protectedNames.has(ref) || openHeads.has(ref) || retained.has(ref)) continue;
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${ref}` });
              } catch (e) { continue; } // already gone
              if (dry) { core.info(`would delete ${ref}`); continue; }
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${ref}` });
              core.info(`deleted ${ref}`);
            }
